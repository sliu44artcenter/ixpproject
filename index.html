<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Witch's Forest</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            overflow: hidden;
            background: #000;
            cursor: crosshair;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #8B7AB8;
            opacity: 0;
            text-shadow: 0 0 20px #8B7AB8;
        }

        #title h1 {
            font-size: 4em;
            margin-bottom: 20px;
            letter-spacing: 4px;
        }

        #title p {
            font-size: 1.5em;
            letter-spacing: 2px;
        }

        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3em;
            color: #fff;
            opacity: 0;
            text-shadow: 0 0 30px currentColor;
            pointer-events: none;
            z-index: 20;
        }

        #restart {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 40px;
            font-size: 1.2em;
            background: rgba(139, 122, 184, 0.3);
            color: #8B7AB8;
            border: 2px solid #8B7AB8;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
            font-family: 'Georgia', serif;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #8B7AB8;
            box-shadow: 0 0 20px rgba(139, 122, 184, 0.5);
        }

        #restart:hover {
            background: rgba(139, 122, 184, 0.6);
            box-shadow: 0 0 30px rgba(139, 122, 184, 0.8);
        }

        #restart.visible {
            opacity: 1;
            pointer-events: all;
        }

        .choice-label {
            position: absolute;
            color: #fff;
            font-size: 1.2em;
            pointer-events: none;
            opacity: 0;
            text-shadow: 0 0 10px currentColor;
            letter-spacing: 1px;
        }

        #instructions {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #8B7AB8;
            font-size: 1em;
            opacity: 0;
            text-align: center;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="overlay">
        <div id="title">
            <h1>THE WITCH'S FOREST</h1>
            <p>Choose Your Path</p>
        </div>
        <div id="message"></div>
        <div id="instructions">Click to choose...</div>
        <button id="restart">Play Again</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0a1a, 0.08);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 8);
        camera.lookAt(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x0a0a1a);
        document.getElementById('container').appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x2d1b4e, 0.3);
        scene.add(ambientLight);

        const moonLight = new THREE.DirectionalLight(0x6b4c9a, 0.5);
        moonLight.position.set(-5, 10, -5);
        scene.add(moonLight);

        // Ground
        const groundGeometry = new THREE.PlaneGeometry(100, 100);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x0d0d1a,
            roughness: 0.9
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = 0;
        scene.add(ground);

        // Trees
        const trees = [];
        function createTree(x, z) {
            const trunkGeometry = new THREE.CylinderGeometry(0.3, 0.4, 5, 8);
            const trunkMaterial = new THREE.MeshStandardMaterial({ color: 0x1a1a2e });
            const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);

            const foliageGeometry = new THREE.ConeGeometry(2, 4, 8);
            const foliageMaterial = new THREE.MeshStandardMaterial({ color: 0x0f1f0f });
            const foliage = new THREE.Mesh(foliageGeometry, foliageMaterial);
            foliage.position.y = 4;

            const tree = new THREE.Group();
            tree.add(trunk);
            tree.add(foliage);
            tree.position.set(x, 2.5, z);

            return tree;
        }

        // Create forest
        const treePositions = [
            [-8, -5], [-6, -8], [-10, -3], [-12, -7],
            [8, -5], [6, -8], [10, -3], [12, -7],
            [-5, -12], [5, -12], [-8, -15], [8, -15],
            [-3, 5], [3, 5], [-6, 3], [6, 3]
        ];

        treePositions.forEach(([x, z]) => {
            const tree = createTree(x, z);
            trees.push(tree);
            scene.add(tree);
        });

        // Particle system for atmosphere
        const particleCount = 200;
        const particlesGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            particlePositions[i] = (Math.random() - 0.5) * 50;
            particlePositions[i + 1] = Math.random() * 20;
            particlePositions[i + 2] = (Math.random() - 0.5) * 50;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            color: 0x6b4c9a,
            size: 0.1,
            transparent: true,
            opacity: 0.6
        });

        const particles = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particles);

        // Choice orbs
        const choices = [];
        const choiceData = [
            { position: [-3, 2, 2], color: 0xff4444, label: 'Follow howls', emoji: '🐺' },
            { position: [0, 2, 2], color: 0xff8800, label: 'Approach fire', emoji: '🔥' },
            { position: [3, 2, 2], color: 0x88ccff, label: 'Enter mist', emoji: '🌫️' }
        ];

        choiceData.forEach((data, index) => {
            const geometry = new THREE.SphereGeometry(0.5, 32, 32);
            const material = new THREE.MeshStandardMaterial({
                color: data.color,
                emissive: data.color,
                emissiveIntensity: 0.5,
                transparent: true,
                opacity: 0.8
            });
            const orb = new THREE.Mesh(geometry, material);
            orb.position.set(...data.position);
            orb.userData = { index, data, originalY: data.position[1] };

            // Glow effect
            const glowGeometry = new THREE.SphereGeometry(0.7, 32, 32);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: data.color,
                transparent: true,
                opacity: 0.2
            });
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            orb.add(glow);

            choices.push(orb);
            scene.add(orb);
        });

        // Raycaster for interaction
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let hoveredChoice = null;
        let gameState = 'intro';

        // Animation loop
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // Animate particles
            particles.rotation.y += 0.0005;
            const positions = particles.geometry.attributes.position.array;
            for (let i = 1; i < positions.length; i += 3) {
                positions[i] += Math.sin(time + positions[i]) * 0.01;
            }
            particles.geometry.attributes.position.needsUpdate = true;

            // Animate orbs
            if (gameState === 'playing') {
                choices.forEach((orb, i) => {
                    orb.position.y = orb.userData.originalY + Math.sin(time * 2 + i) * 0.2;
                    orb.rotation.y += 0.01;

                    // Pulse glow
                    const glow = orb.children[0];
                    if (glow) {
                        glow.scale.setScalar(1 + Math.sin(time * 3 + i) * 0.1);
                    }
                });
            }

            renderer.render(scene, camera);
        }

        // Mouse interaction
        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            if (gameState === 'playing') {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(choices);

                // Reset previous hover
                if (hoveredChoice && !intersects.find(i => i.object === hoveredChoice)) {
                    gsap.to(hoveredChoice.scale, { x: 1, y: 1, z: 1, duration: 0.3 });
                    hoveredChoice.material.emissiveIntensity = 0.5;
                    hoveredChoice = null;
                    document.body.style.cursor = 'crosshair';
                }

                // New hover
                if (intersects.length > 0) {
                    const obj = intersects[0].object;
                    if (obj !== hoveredChoice) {
                        hoveredChoice = obj;
                        gsap.to(obj.scale, { x: 1.3, y: 1.3, z: 1.3, duration: 0.3 });
                        obj.material.emissiveIntensity = 1;
                        document.body.style.cursor = 'pointer';
                    }
                }
            }
        }

        function onClick() {
            if (gameState === 'playing' && hoveredChoice) {
                const index = hoveredChoice.userData.index;
                makeChoice(index);
            }
        }

        // Choice outcomes
        function makeChoice(index) {
            gameState = 'ending';
            document.body.style.cursor = 'crosshair';

            // Hide all choices
            choices.forEach(orb => {
                gsap.to(orb.material, { opacity: 0, duration: 0.5 });
                gsap.to(orb.position, { y: -2, duration: 0.5 });
            });

            gsap.to('#instructions', { opacity: 0, duration: 0.3 });

            if (index === 0) {
                // Howls - Werewolf encounter
                wolfEnding();
            } else if (index === 1) {
                // Fire - Witch encounter
                fireEnding();
            } else {
                // Mist - Ghost encounter
                mistEnding();
            }
        }

        function wolfEnding() {
            // Red moon
            gsap.to(moonLight.color, { r: 1, g: 0.2, b: 0.2, duration: 2 });
            gsap.to(moonLight, { intensity: 1.5, duration: 2 });
            gsap.to(scene.fog, { density: 0.15, duration: 2 });

            // Camera shake and move
            gsap.to(camera.position, {
                x: -2,
                y: 1,
                z: 6,
                duration: 2,
                ease: 'power2.inOut'
            });

            gsap.to(camera.rotation, {
                z: 0.1,
                duration: 0.1,
                repeat: 10,
                yoyo: true
            });

            // Show message
            setTimeout(() => {
                showMessage('Hunted...', '#ff4444');
            }, 2000);

            setTimeout(() => {
                showRestart();
            }, 4000);
        }

        function fireEnding() {
            // Orange glow
            const fireLight = new THREE.PointLight(0xff6600, 2, 20);
            fireLight.position.set(0, 2, -5);
            scene.add(fireLight);

            gsap.to(ambientLight, { intensity: 0.1, duration: 2 });
            gsap.to(scene.fog, { density: 0.12, duration: 2 });

            // Animate fire light
            gsap.to(fireLight, {
                intensity: 3,
                duration: 0.5,
                repeat: 6,
                yoyo: true
            });

            // Camera approach
            gsap.to(camera.position, {
                z: 4,
                y: 1.5,
                duration: 3,
                ease: 'power2.inOut'
            });

            // Create witch silhouette
            const witchGeometry = new THREE.ConeGeometry(0.5, 2, 8);
            const witchMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const witch = new THREE.Mesh(witchGeometry, witchMaterial);
            witch.position.set(0, 1, 0);
            scene.add(witch);

            gsap.from(witch.scale, { x: 0, y: 0, z: 0, duration: 1, delay: 1 });

            setTimeout(() => {
                showMessage('Enchanted...', '#ff8800');
            }, 2500);

            setTimeout(() => {
                showRestart();
            }, 4500);
        }

        function mistEnding() {
            // White fog
            gsap.to(scene.fog.color, { r: 0.7, g: 0.7, b: 0.8, duration: 2 });
            gsap.to(scene.fog, { density: 0.25, duration: 2 });

            gsap.to(ambientLight.color, { r: 0.8, g: 0.9, b: 1, duration: 2 });
            gsap.to(ambientLight, { intensity: 0.8, duration: 2 });

            // Create floating spirits
            for (let i = 0; i < 5; i++) {
                const spiritGeometry = new THREE.SphereGeometry(0.3, 16, 16);
                const spiritMaterial = new THREE.MeshBasicMaterial({
                    color: 0xccffff,
                    transparent: true,
                    opacity: 0.4
                });
                const spirit = new THREE.Mesh(spiritGeometry, spiritMaterial);
                spirit.position.set(
                    (Math.random() - 0.5) * 10,
                    Math.random() * 5 + 1,
                    (Math.random() - 0.5) * 10
                );
                scene.add(spirit);

                gsap.to(spirit.position, {
                    y: spirit.position.y + 5,
                    duration: 3,
                    ease: 'power1.inOut'
                });

                gsap.to(spirit.material, {
                    opacity: 0,
                    duration: 3
                });
            }

            // Camera rises
            gsap.to(camera.position, {
                y: 4,
                z: 6,
                duration: 3,
                ease: 'power2.inOut'
            });

            setTimeout(() => {
                showMessage('Lost...', '#88ccff');
            }, 2000);

            setTimeout(() => {
                showRestart();
            }, 4000);
        }

        function showMessage(text, color) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.style.color = color;
            gsap.to(msg, { opacity: 1, duration: 1 });
            gsap.to(msg, { opacity: 0, duration: 1, delay: 1.5 });
        }

        function showRestart() {
            document.getElementById('restart').classList.add('visible');
        }

        // Restart function
        function restart() {
            document.getElementById('restart').classList.remove('visible');
            document.getElementById('message').style.opacity = 0;

            // Reset scene
            while(scene.children.length > 0) {
                scene.remove(scene.children[0]);
            }

            // Reload page (simplest reset)
            location.reload();
        }

        // Intro sequence
        function startIntro() {
            const title = document.getElementById('title');
            const instructions = document.getElementById('instructions');

            gsap.to(title, { opacity: 1, duration: 2 });
            gsap.to(title, { opacity: 0, duration: 1, delay: 3 });

            gsap.to(camera.position, {
                z: 8,
                duration: 4,
                ease: 'power2.inOut'
            });

            setTimeout(() => {
                gameState = 'playing';
                choices.forEach(orb => {
                    gsap.to(orb.material, { opacity: 0.8, duration: 1 });
                });
                gsap.to(instructions, { opacity: 0.7, duration: 1 });
            }, 4000);
        }

        // Event listeners
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('click', onClick);
        document.getElementById('restart').addEventListener('click', restart);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start
        animate();
        startIntro();
    </script>
</body>
</html>
